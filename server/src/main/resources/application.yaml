spring:
  application:
    name: ares
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    context-path: /api

ares:
  auth:
    issuer: ares
    access-token-secret: ${ARES_AUTH_ACCESS_TOKEN_SECRET:ares-development-access-token-secret-change-me}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  storage:
    base-dir: /tmp/ares
